/**
 * Annuals ID Game — iNaturalist API
 *
 * Loads the embedded HORT 1230 Annuals Quiz 2 list, fetches live photos from
 * iNaturalist, and runs a common-name + scientific-name identification game.
 */

// ─── Configuration ───────────────────────────────────────────────────────────

const INAT_API = 'https://api.inaturalist.org/v2';
const API_TIMEOUT_MS = 15000;

// ─── State ───────────────────────────────────────────────────────────────────

let speciesList = [];
let speciesDeck = [];
let observationPool = [];
let usedObservationIds = new Set();
let currentSpecies = null;
let currentObs = null;
let currentPhotoIndex = 0;
let isAnswered = false;
let roundResults = [];
let score = 0;
let isLoading = false;
let roundToken = 0;
let photoToken = 0;

const dom = {};

// ─── Species data ────────────────────────────────────────────────────────────

// BUILD_STANDALONE_LOAD_SPECIES_START
function loadSpecies() {
  speciesList = ANNUAL_SPECIES;
  return Promise.resolve(speciesList);
}
// BUILD_STANDALONE_LOAD_SPECIES_END

// ─── API ─────────────────────────────────────────────────────────────────────

async function fetchWithTimeout(url, timeoutMs = API_TIMEOUT_MS) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

  try {
    return await fetch(url, { signal: controller.signal });
  } finally {
    clearTimeout(timeoutId);
  }
}

/** Include cultivated garden plants as well as wild observations. */
async function fetchObservations(species, perPage = 20) {
  const params = new URLSearchParams({
    taxon_id: String(species.inatTaxonId),
    photos: 'true',
    per_page: String(perPage),
    page: '1',
    order: 'desc',
    order_by: 'created_at',
    fields: [
      'id',
      'uri',
      'user.login',
      'user.name',
      'photos.url',
      'photos.attribution',
      'photos.license_code',
      'taxon.id',
      'taxon.name',
      'taxon.preferred_common_name',
    ].join(','),
  });

  if (species.observationRank) params.set('rank', species.observationRank);
  if (species.cultivatedOnly) params.set('captive', 'true');

  const url = `${INAT_API}/observations?${params}`;
  const resp = await fetchWithTimeout(url);
  if (!resp.ok) throw new Error(`iNaturalist API error ${resp.status}`);

  const data = await resp.json();
  if (!Array.isArray(data.results)) {
    throw new Error('iNaturalist returned an invalid response');
  }

  return data.results.filter((observation) => observation.photos?.length > 0);
}

async function fetchAltObservation(species) {
  const fresh = await fetchObservations(species, 20);
  const unused = fresh.filter((observation) => !usedObservationIds.has(observation.id));
  const pool = unused.length > 0 ? unused : fresh;
  return pool[Math.floor(Math.random() * pool.length)] || null;
}

// ─── Answer matching ─────────────────────────────────────────────────────────

function normalize(value) {
  return (value || '')
    .toLowerCase()
    .replace(/[''‘’"“”]/g, '')
    .replace(/×/g, ' x ')
    .replace(/\bx(?=hybrida\b|atkinsiana\b|hortensis\b)/g, 'x ')
    .replace(/[^\w\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function acceptedForms(species) {
  const forms = new Set();
  for (const name of [species.commonName, ...(species.aliases || [])]) {
    if (name) forms.add(normalize(name));
  }
  return forms;
}

function matchesCommon(species, value) {
  return acceptedForms(species).has(normalize(value));
}

function matchesScientific(species, value) {
  const names = [species.scientificName].concat(species.scientificAliases || []);
  return names.some((name) => normalize(value) === normalize(name));
}

// ─── Species order ───────────────────────────────────────────────────────────

function shuffled(items) {
  const copy = [...items];
  for (let index = copy.length - 1; index > 0; index -= 1) {
    const randomIndex = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
  }
  return copy;
}

function takeNextSpecies() {
  if (speciesDeck.length === 0) {
    speciesDeck = shuffled(speciesList);

    // Avoid an immediate repeat where two shuffled deck cycles meet.
    if (speciesDeck.length > 1 && speciesDeck[0].id === currentSpecies?.id) {
      [speciesDeck[0], speciesDeck[1]] = [speciesDeck[1], speciesDeck[0]];
    }
  }

  return speciesDeck.shift();
}

// ─── Game logic ──────────────────────────────────────────────────────────────

async function startGame() {
  score = 0;
  roundResults = [];
  speciesDeck = [];
  usedObservationIds.clear();
  observationPool = [];
  currentSpecies = null;
  currentObs = null;
  isAnswered = false;
  isLoading = false;

  dom.frame.style.display = 'flex';
  dom.errorMessage.classList.remove('show');
  dom.nextBtn.classList.remove('show');
  dom.feedback.classList.remove('show');
  dom.altPhotoBtn.classList.remove('show');

  if (speciesList.length === 0) {
    try {
      await loadSpecies();
    } catch (error) {
      console.error(error);
      showError('Failed to load the annuals list.');
      return;
    }
  }

  startRound();
}

function startRound() {
  roundToken += 1;
  photoToken += 1;
  isAnswered = false;
  isLoading = false;
  currentObs = null;
  currentPhotoIndex = 0;
  currentSpecies = takeNextSpecies();

  dom.nextBtn.classList.remove('show');
  dom.feedback.classList.remove('show');
  dom.altPhotoBtn.classList.remove('show');
  dom.altPhotoBtn.disabled = false;

  dom.answerCommon.disabled = false;
  dom.answerSci.disabled = false;
  dom.answerCommon.value = '';
  dom.answerSci.value = '';
  dom.answerCommon.classList.remove('field-correct', 'field-wrong');
  dom.answerSci.classList.remove('field-correct', 'field-wrong');
  dom.studyDetails.hidden = true;
  dom.studyDetails.replaceChildren();
  dom.commonHint.textContent = '';
  dom.sciHint.textContent = '';
  dom.submitBtn.disabled = true;

  updateScoreBar();
  updateProgress();
  loadPhoto(currentSpecies, roundToken);
  if (shouldAutoFocusAnswer()) dom.answerCommon.focus();
}

async function loadPhoto(species, requestRoundToken = roundToken) {
  if (!species || requestRoundToken !== roundToken) return;

  isLoading = true;
  dom.submitBtn.disabled = true;
  dom.altPhotoBtn.classList.remove('show');
  setAnswerFieldsDisabled(false);
  showPhotoLoading();

  try {
    let observation = observationPool.find(
      (candidate) => candidate._speciesId === species.id && !usedObservationIds.has(candidate.id),
    );

    if (!observation) {
      observation = await fetchAltObservation(species);
      if (requestRoundToken !== roundToken) return;

      if (observation) {
        observation._speciesId = species.id;
        observationPool.push(observation);
      }
    }

    if (!observation) {
      showPhotoUnavailable('No usable iNaturalist photo was found for this annual.');
      return;
    }

    currentObs = observation;
    usedObservationIds.add(observation.id);
    currentPhotoIndex = 0;

    const displayed = await showPhoto(observation, 0, requestRoundToken);
    if (requestRoundToken !== roundToken) return;

    if (!displayed) {
      showPhotoUnavailable('The plant photo could not be displayed.');
      return;
    }

    dom.submitBtn.disabled = false;
    dom.altPhotoBtn.disabled = false;
    dom.altPhotoBtn.classList.add('show');
  } catch (error) {
    if (requestRoundToken !== roundToken) return;
    console.error('Could not load plant photo:', error);
    showPhotoUnavailable('Could not reach iNaturalist or load this photo.');
  } finally {
    if (requestRoundToken === roundToken) isLoading = false;
  }
}

async function handleAnotherPhoto() {
  if (isLoading || isAnswered || !currentSpecies || !currentObs) return;

  const requestRoundToken = roundToken;
  const previousObservation = currentObs;
  const previousPhotoIndex = currentPhotoIndex;
  let photoReady = false;

  isLoading = true;
  dom.submitBtn.disabled = true;
  dom.altPhotoBtn.disabled = true;

  try {
    let nextObservation = currentObs;
    let nextPhotoIndex = currentPhotoIndex;

    if (currentObs.photos.length > 1) {
      nextPhotoIndex = (currentPhotoIndex + 1) % currentObs.photos.length;
    } else {
      showPhotoLoading();
      nextObservation = await fetchAltObservation(currentSpecies);
      if (requestRoundToken !== roundToken) return;

      if (!nextObservation) {
        throw new Error('No alternative observation was available');
      }

      nextObservation._speciesId = currentSpecies.id;
      observationPool.push(nextObservation);
      usedObservationIds.add(nextObservation.id);
      nextPhotoIndex = 0;
    }

    const displayed = await showPhoto(nextObservation, nextPhotoIndex, requestRoundToken);
    if (requestRoundToken !== roundToken) return;
    if (!displayed) throw new Error('Alternative photo could not be displayed');

    currentObs = nextObservation;
    currentPhotoIndex = nextPhotoIndex;
    photoReady = true;
  } catch (error) {
    if (requestRoundToken !== roundToken) return;
    console.error('Could not load another photo:', error);

    currentObs = previousObservation;
    currentPhotoIndex = previousPhotoIndex;
    const restored = await showPhoto(previousObservation, previousPhotoIndex, requestRoundToken);
    if (!restored) {
      showPhotoUnavailable('The plant photo could not be restored.');
      return;
    }

    photoReady = true;
    showTemporaryFeedback('Could not load another photo. Please try again.', 'wrong');
  } finally {
    if (requestRoundToken === roundToken && !isAnswered && photoReady) {
      isLoading = false;
      dom.submitBtn.disabled = false;
      dom.altPhotoBtn.disabled = false;
      dom.altPhotoBtn.classList.add('show');
    }
  }
}

function handleAnswer() {
  if (isAnswered || isLoading || !currentObs) return;

  const commonValue = dom.answerCommon.value;
  const scientificValue = dom.answerSci.value;
  if (!commonValue.trim() && !scientificValue.trim()) return;

  isAnswered = true;

  const commonCorrect = matchesCommon(currentSpecies, commonValue);
  const scientificCorrect = matchesScientific(currentSpecies, scientificValue);
  const points = (commonCorrect ? 0.5 : 0) + (scientificCorrect ? 0.5 : 0);
  score += points;
  roundResults.push(points);

  setAnswerFieldsDisabled(true);
  dom.submitBtn.disabled = true;

  markField(dom.answerCommon, dom.commonHint, commonCorrect, currentSpecies.commonName);
  markField(dom.answerSci, dom.sciHint, scientificCorrect, currentSpecies.scientificName);

  const name = currentSpecies.commonName || currentSpecies.scientificName;
  if (points === 1) {
    showFeedback(`✅ Correct! ${name}`, 'correct');
  } else if (points === 0.5) {
    const wrongField = commonCorrect ? 'scientific name' : 'common name';
    showFeedback(`🟡 Half right — the ${wrongField} was wrong. It’s ${name}.`, 'partial');
  } else {
    showFeedback(`❌ It was ${name}.`, 'wrong');
  }

  const pronunciation = document.createElement('p');
  pronunciation.textContent = `Pronunciation (course guide): ${currentSpecies.pronunciation}`;
  dom.studyDetails.replaceChildren(pronunciation);
  for (const note of [currentSpecies.studyNote, currentSpecies.photoNote]) {
    if (note) {
      const paragraph = document.createElement('p');
      paragraph.textContent = note;
      dom.studyDetails.append(paragraph);
    }
  }
  dom.studyDetails.hidden = false;

  revealPhotoAttribution();
  updateScoreBar();
  updateProgress();

  dom.altPhotoBtn.classList.remove('show');
  dom.nextBtn.textContent = 'Next Annual →';
  dom.nextBtn.classList.add('show');
  dom.nextBtn.focus();
}

function markField(input, hintElement, correct, correctValue) {
  input.classList.add(correct ? 'field-correct' : 'field-wrong');
  hintElement.textContent = correct ? `✓ ${correctValue}` : `✗ ${correctValue}`;
  hintElement.className = `field-hint ${correct ? 'hint-correct' : 'hint-wrong'}`;
}

function setAnswerFieldsDisabled(disabled) {
  dom.answerCommon.disabled = disabled;
  dom.answerSci.disabled = disabled;
}

function shouldAutoFocusAnswer() {
  const coarsePointer = window.matchMedia?.('(pointer: coarse)').matches;
  const touchDevice = navigator.maxTouchPoints > 0;
  return !coarsePointer && !touchDevice;
}

function advanceRound() {
  startRound();
}

// ─── Photo rendering ─────────────────────────────────────────────────────────

function showPhotoLoading() {
  const spinner = document.createElement('div');
  spinner.className = 'loading-spinner';
  spinner.setAttribute('role', 'status');
  spinner.setAttribute('aria-label', 'Loading plant photo');
  dom.imgContainer.replaceChildren(spinner);
}

function showPhotoUnavailable(message) {
  isLoading = false;
  photoToken += 1;
  dom.submitBtn.disabled = true;
  dom.altPhotoBtn.disabled = false;
  dom.altPhotoBtn.classList.remove('show');
  setAnswerFieldsDisabled(true);

  const panel = document.createElement('div');
  panel.className = 'photo-message';

  const icon = document.createElement('span');
  icon.className = 'photo-message-icon';
  icon.setAttribute('aria-hidden', 'true');
  icon.textContent = '🌿';

  const text = document.createElement('p');
  text.textContent = message;

  const actions = document.createElement('div');
  actions.className = 'photo-actions';

  const retryButton = document.createElement('button');
  retryButton.type = 'button';
  retryButton.textContent = 'Retry photo';
  retryButton.addEventListener('click', () => loadPhoto(currentSpecies, roundToken));

  const skipButton = document.createElement('button');
  skipButton.type = 'button';
  skipButton.className = 'secondary';
  skipButton.textContent = 'Skip annual';
  skipButton.addEventListener('click', startRound);

  actions.append(retryButton, skipButton);
  panel.append(icon, text, actions);
  dom.imgContainer.replaceChildren(panel);
  retryButton.focus();
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.alt = 'Annual identification photo';
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error(`Could not load image: ${url}`));
    image.src = url;
  });
}

async function showPhoto(observation, index = 0, requestRoundToken = roundToken) {
  const photo = observation?.photos?.[index] || observation?.photos?.[0];
  if (!photo?.url) return false;

  const requestPhotoToken = ++photoToken;
  showPhotoLoading();

  const mediumUrl = photo.url.replace('/square.', '/medium.');
  const candidateUrls = [...new Set([mediumUrl, photo.url])];

  for (const url of candidateUrls) {
    try {
      const image = await loadImage(url);
      if (requestRoundToken !== roundToken || requestPhotoToken !== photoToken) return false;

      currentPhotoIndex = observation.photos.indexOf(photo);
      renderPhoto(image, observation, photo);
      return true;
    } catch (error) {
      // Try the next image size before reporting a failure.
    }
  }

  return false;
}

function renderPhoto(image, observation, photo) {
  const caption = document.createElement('div');
  caption.className = 'photo-label';
  caption.textContent = '📸 iNaturalist observation';

  image.alt = isAnswered
    ? `Photo of ${currentSpecies.commonName || currentSpecies.scientificName}`
    : 'Annual identification photo';

  dom.imgContainer.replaceChildren(image, caption);

  if (isAnswered) renderPhotoAttribution(caption, observation, photo);
}

function revealPhotoAttribution() {
  const image = dom.imgContainer.querySelector('img');
  const caption = dom.imgContainer.querySelector('.photo-label');
  const photo = currentObs?.photos?.[currentPhotoIndex] || currentObs?.photos?.[0];
  if (!image || !caption || !photo || !currentObs) return;

  image.alt = `Photo of ${currentSpecies.commonName || currentSpecies.scientificName}`;
  renderPhotoAttribution(caption, currentObs, photo);
}

function renderPhotoAttribution(caption, observation, photo) {
  const observationUrl = observation.uri || `https://www.inaturalist.org/observations/${observation.id}`;
  const attribution = photo.attribution
    || observation.user?.name
    || observation.user?.login
    || 'iNaturalist contributor';

  const link = document.createElement('a');
  link.href = observationUrl;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.textContent = `📸 ${attribution} · View on iNaturalist`;

  caption.replaceChildren(link);
}

// ─── UI rendering ────────────────────────────────────────────────────────────

function showFeedback(message, type) {
  dom.feedback.textContent = message;
  dom.feedback.className = `show ${type}`;
}

function showTemporaryFeedback(message, type) {
  showFeedback(message, type);
  setTimeout(() => {
    if (!isAnswered) dom.feedback.classList.remove('show');
  }, 2500);
}

function updateScoreBar() {
  dom.scoreValue.textContent = `${formatScore(score)} / ${roundResults.length}`;
}

function formatScore(value) {
  return value % 1 === 0 ? String(value) : value.toFixed(1);
}

function updateProgress() {
  const maxDots = 12;
  const recent = roundResults.slice(-maxDots);
  dom.progressDots.replaceChildren();

  for (const points of recent) {
    const dot = document.createElement('span');
    dot.className = `dot ${points === 1 ? 'correct' : points === 0.5 ? 'partial' : 'wrong'}`;
    dom.progressDots.appendChild(dot);
  }

  if (!isAnswered) {
    const active = document.createElement('span');
    active.className = 'dot active';
    dom.progressDots.appendChild(active);
  }
}

function showError(message) {
  dom.frame.style.display = 'none';
  dom.errorMessage.classList.add('show');

  const text = document.createElement('p');
  text.textContent = message;

  const retryButton = document.createElement('button');
  retryButton.type = 'button';
  retryButton.className = 'retry-btn';
  retryButton.textContent = 'Retry';
  retryButton.addEventListener('click', () => window.location.reload());

  dom.errorMessage.replaceChildren(text, retryButton);
}

// ─── Init ────────────────────────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', () => {
  if (window.matchMedia?.('(display-mode: standalone)').matches || navigator.standalone === true) {
    document.documentElement.classList.add('standalone');
  }
  dom.imgContainer = document.getElementById('img-container');
  dom.feedback = document.getElementById('feedback');
  dom.studyDetails = document.getElementById('study-details');
  dom.nextBtn = document.getElementById('next-btn');
  dom.altPhotoBtn = document.getElementById('alt-photo-btn');
  dom.scoreValue = document.getElementById('score-value');
  dom.progressDots = document.getElementById('progress-dots');
  dom.frame = document.getElementById('frame');
  dom.errorMessage = document.getElementById('error-message');
  dom.answerCommon = document.getElementById('answer-common');
  dom.answerSci = document.getElementById('answer-sci');
  dom.submitBtn = document.getElementById('submit-btn');
  dom.commonHint = document.getElementById('common-hint');
  dom.sciHint = document.getElementById('sci-hint');

  dom.nextBtn.addEventListener('click', advanceRound);
  dom.altPhotoBtn.addEventListener('click', handleAnotherPhoto);
  dom.submitBtn.addEventListener('click', handleAnswer);

  for (const input of [dom.answerCommon, dom.answerSci]) {
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') handleAnswer();
    });
  }

  startGame();
});

</script>
